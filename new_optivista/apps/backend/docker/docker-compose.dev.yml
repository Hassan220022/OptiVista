version: '3.8'

services:
  backend:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../app:/app/app
    env_file:
      - ../.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Add other services like Nginx or a local Supabase instance if needed
